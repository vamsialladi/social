server.port=8080

spring.application.name=social-backend

# H2 Database configuration with file persistence and auto-server mode
spring.datasource.url=jdbc:h2:file:./data/socialdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Media upload storage path
app.upload.dir=./uploads

# Azure AI Content Safety configuration (required before posts can be published)
app.content-safety.endpoint=${APP_CONTENT_SAFETY_ENDPOINT:}
app.content-safety.key=${APP_CONTENT_SAFETY_KEY:}
app.content-safety.block-severity=${APP_CONTENT_SAFETY_BLOCK_SEVERITY:4}
