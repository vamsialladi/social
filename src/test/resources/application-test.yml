spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  messaging:
    rate-limit:
      max-requests: 100
      window-seconds: 60
    require-accepted-connection: false
  auth:
    rate-limit:
      login:
        max-requests: 10
        window-seconds: 60
      register:
        max-requests: 10
        window-seconds: 60
    cookie:
      name: session_token
      secure: false
      same-site: Lax
      max-age-seconds: 604800

