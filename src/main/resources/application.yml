server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: social-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:social_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Springdoc / Swagger UI config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application configurations
app:
  media:
    storage-dir: uploads
    base-url: /api/media/files/
    max-demo-video-size-bytes: 5242880 # 5 MB
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - video/mp4
      - video/webm
      - video/quicktime
      - audio/mpeg
      - audio/wav
      - audio/ogg
      - audio/mp4
      - audio/aac
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
  messaging:
    rate-limit:
      max-requests: 30
      window-seconds: 60
    require-accepted-connection: false
  auth:
    rate-limit:
      login:
        max-requests: 5
        window-seconds: 60
      register:
        max-requests: 5
        window-seconds: 60
    cookie:
      name: session_token
      secure: false
      same-site: Lax
      max-age-seconds: 604800 # 7 days
    jwt:
      secret: ${JWT_SECRET:c29jaWFsLW1lZGlhLXNlY3JldC1rZXktZm9yLWF1dGhlbnRpY2F0aW9uLXN5c3RlbS0yMDI2LXN1cGVyLXNlY3VyZQ==}
      expiration-seconds: 86400 # 24 hours
