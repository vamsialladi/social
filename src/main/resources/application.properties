server.port=${PORT:8080}
server.servlet.context-path=/

spring.application.name=social-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:social_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Media Storage Configuration
app.media.storage-dir=uploads
app.media.base-url=/api/media/files/
app.media.max-demo-video-size-bytes=5242880
app.media.allowed-content-types=image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/aac,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain

# Messaging & Rate Limiter Configuration
app.messaging.rate-limit.max-requests=100
app.messaging.rate-limit.window-seconds=60
app.messaging.require-accepted-connection=false

# Auth & Rate Limiter Configuration
app.auth.rate-limit.login.max-requests=10
app.auth.rate-limit.login.window-seconds=60
app.auth.rate-limit.register.max-requests=10
app.auth.rate-limit.register.window-seconds=60

# Session Cookie Configuration
app.auth.cookie.name=session_token
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
app.auth.cookie.max-age-seconds=604800
